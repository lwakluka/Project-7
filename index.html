<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="youtube.png" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css" />
  <title>YouTube Trends</title>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar md:block">
    <div class="sidebar-top flex items-center justify-between px-3 py-3 md:py-4">
      <div class="flex items-center gap-3">
        <img src="youtube.png" alt="logo" class="w-7 h-7" />
        <span class="sidebar-label text-lg font-semibold">YouTube</span>
      </div>

      <!-- mini toggle (desktop) + close (mobile) -->
      <div class="flex items-center gap-2">
        <button id="miniToggle" title="Toggle mini sidebar" class="hidden md:inline-flex p-1">
          <ion-icon name="chevron-back-outline" class="text-gray-300"></ion-icon>
        </button>
        <button id="closeSidebar" title="Close menu" class="md:hidden p-1">
          <ion-icon name="close-outline" class="text-gray-300"></ion-icon>
        </button>
      </div>
    </div>

    <nav class="mt-2 px-2">
      <a href="#" class="sidebar-link active"><ion-icon name="home-outline"></ion-icon><span class="sidebar-label">Home</span></a>
      <a href="#" class="sidebar-link"><ion-icon name="flame-outline"></ion-icon><span class="sidebar-label">Trending</span></a>
      <a href="#" class="sidebar-link"><ion-icon name="albums-outline"></ion-icon><span class="sidebar-label">Subscriptions</span></a>
      <hr class="border-gray-800 my-2" />
      <a href="#" class="sidebar-link"><ion-icon name="library-outline"></ion-icon><span class="sidebar-label">Library</span></a>
      <a href="#" class="sidebar-link"><ion-icon name="time-outline"></ion-icon><span class="sidebar-label">History</span></a>
      <a href="#" class="sidebar-link"><ion-icon name="bookmark-outline"></ion-icon><span class="sidebar-label">Watch Later</span></a>
    </nav>
  </aside>

  <!-- MAIN LAYOUT -->
  <div class="page-content min-h-screen">

    <!-- HEADER -->
    <header class="w-full sticky top-0 z-30 bg-black flex items-center justify-between px-4 sm:px-8 py-2.5 border-b border-gray-800">
      <div class="flex items-center gap-4">
        <!-- Mobile menu button -->
        <button id="menuBtn" class="md:hidden text-2xl p-1">
          <ion-icon name="menu-outline"></ion-icon>
        </button>

        <div class="flex items-center gap-2">
          <img src="youtube.png" alt="YouTube" class="md:w-8 md:h-8 h-9 w-15" />
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight hidden md:flex">YouTube Trends</h1>
        </div>
      </div>

      <!-- Search -->
      <div class="flex items-center w-full sm:w-auto justify-center sm:justify-start max-w-[720px] mx-4">
        <input id="searchInput" type="search" placeholder="Search trending videos..."
          class="w-full sm:w-[30rem] p-2 px-4 text-sm rounded-l-full border border-gray-600 bg-black text-white focus:outline-none focus:border-red-600" />
        <button id="searchBtn"
          class="bg-[#111] hover:bg-[#222] border border-gray-600 border-l-0 rounded-r-full px-4 py-2 flex items-center justify-center">
          <ion-icon name="search" class="text-gray-400"></ion-icon>
        </button>
      </div>

      <div class="hidden sm:flex gap-4 items-center">
        <ion-icon name="notifications-outline" class="text-gray-300 size-6"></ion-icon>
        <ion-icon name="person-circle-outline" class="text-gray-300 size-7"></ion-icon>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="p-4 sm:p-6">
      <div id="results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>
  </div>

  <script src="script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
